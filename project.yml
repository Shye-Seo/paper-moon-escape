name: PaperMoonEscape
options:
  bundleIdPrefix: com.quoguri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  PaperMoonCore:
    path: Packages/PaperMoonCore

targets:
  PaperMoonEscape:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Products.storekit
        buildPhase: none
    dependencies:
      - package: PaperMoonCore
    settings:
      base:
        PRODUCT_NAME: PaperMoonEscape
        PRODUCT_BUNDLE_IDENTIFIER: com.quoguri.papermoonescape.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "종이달 다락방"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  PaperMoonEscapeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PaperMoonEscape
      - package: PaperMoonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quoguri.papermoonescape.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PaperMoonEscape:
    build:
      targets:
        PaperMoonEscape: all
        PaperMoonEscapeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaperMoonEscapeTests
